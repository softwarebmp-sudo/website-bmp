<section class="bmp-portfolio-section">
  <div class="container">

    <div class="bmp-portfolio-header">
      <div>
        <span class="tp-section-title-pre">PORTAFOLIO</span>
        <h3 class="tp-section-title">Proyectos que reflejan nuestra experiencia</h3>
      </div>

      <p>
        Soluciones desarrolladas con precisión técnica, diseño funcional y ejecución profesional
        para diferentes sectores.
      </p>
    </div>

    <div class="bmp-portfolio-filters" *ngIf="portfolioTypes.length">
      <button
        type="button"
        [class.active]="activeFilter === 'all'"
        (click)="filterPortfolio('all')">
        Todos
      </button>

      <button
        type="button"
        *ngFor="let type of portfolioTypes"
        [class.active]="activeFilter === type"
        (click)="filterPortfolio(type)">
        {{ formatFilterName(type) }}
      </button>
    </div>

    <div class="bmp-portfolio-loading" *ngIf="loadingPortfolio">
      Cargando proyectos...
    </div>

    <div class="bmp-portfolio-grid" *ngIf="!loadingPortfolio">
      <article
        class="bmp-portfolio-card"
        *ngFor="let portfolio of filteredPortfolioList">

        <a [routerLink]="['/portfolio', portfolio.id]" class="bmp-portfolio-image">
          <img [src]="getPortfolioCoverUrl(portfolio)" [alt]="portfolio.name">
        </a>

        <div class="bmp-portfolio-content">
          <div>
            <span>{{ portfolio.category || formatFilterName(portfolio.type) }}</span>
            <h4>
              <a [routerLink]="['/portfolio', portfolio.id]">
                {{ portfolio.name }}
              </a>
            </h4>
          </div>

          <a [routerLink]="['/portfolio', portfolio.id]" class="bmp-portfolio-btn">
            <i class="fa-regular fa-plus"></i>
          </a>
        </div>

      </article>
    </div>

  </div>
</section>
